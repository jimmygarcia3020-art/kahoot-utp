# Perfil demo: pensado para desarrollo y sustentacion, nunca para produccion.
# Devuelve los codigos de verificacion en la respuesta JSON porque no hay SMTP.
seguridad.exponer-codigos=true

# En demo el esquema puede evolucionar con Hibernate; prod usa Flyway + validate.
spring.jpa.hibernate.ddl-auto=update

# Flyway sigue activo para que las migraciones sean las mismas en todos los entornos.
spring.flyway.enabled=true
