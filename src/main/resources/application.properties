spring.application.name=adaptcode-utp-api
server.port=${PORT:8080}

# Perfil por defecto: demo (carga el catalogo inicial y expone codigos para
# probar sin servicio de correo). En un despliegue real usar ADAPTCODE_PROFILE=prod
# o -Dspring.profiles.active=prod. El perfil prod valida que no queden valores demo.
spring.profiles.active=${ADAPTCODE_PROFILE:demo}

# Conexion a PostgreSQL / Supabase. NO se guardan credenciales en el repositorio:
# define ADAPTCODE_DB_URL, ADAPTCODE_DB_USERNAME y ADAPTCODE_DB_PASSWORD en el
# entorno o en un secret manager. Sin ellas la aplicacion no arranca.
# prepareThreshold=0: el pooler en modo transaccion no comparte prepared statements.
# sslmode=require: fuerza conexion cifrada.
spring.datasource.url=${ADAPTCODE_DB_URL:}
spring.datasource.username=${ADAPTCODE_DB_USERNAME:}
spring.datasource.password=${ADAPTCODE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool chico: es un pooler compartido, no acapares conexiones.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

# El esquema se controla con Flyway. En desarrollo se permite update para no
# bloquear a quien clona el proyecto; en prod (application-prod.properties) es validate.
spring.jpa.hibernate.ddl-auto=${ADAPTCODE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Migraciones incrementales. baseline-on-migrate permite adoptar una base que ya
# tenia el esquema antes de Flyway sin recrearla.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Seguridad JWT. JWT_SECRET es obligatorio en prod (validado al arrancar); el
# valor por defecto es SOLO para demo y no debe reutilizarse.
jwt.secret=${JWT_SECRET:dev-only-demo-jwt-secret-change-me-2026}
jwt.expiration=900000
jwt.refresh-expiration=2592000000
jwt.emitter=adaptcode-utp-api

# Códigos de verificación y recuperación (en minutos).
seguridad.codigo-expiracion-minutos=30
# Pepper para hashear códigos en reposo. En prod debe definirse CODIGO_PEPPER.
seguridad.codigo-pepper=${CODIGO_PEPPER:dev-only-codigo-pepper-change-me-2026}

# Fuerza bruta: intentos fallidos por correo antes del bloqueo temporal.
seguridad.login-max-intentos=5
seguridad.login-bloqueo-minutos=15

# Códigos: intentos máximos por código, espera mínima entre reenvíos y tope
# diario por correo/tipo para frenar el abuso del envío de correos.
seguridad.codigo-max-intentos=5
seguridad.codigo-reenvio-segundos=60
seguridad.codigo-max-por-dia=10

# Refresh tokens: máximo de sesiones activas por usuario y limpieza diaria.
seguridad.refresh-max-sesiones=5
seguridad.refresh-limpieza-cron=0 0 3 * * *

# Correo saliente (SMTP). Sin ADAPTCODE_MAIL_HOST el código no se envía y solo
# funciona el modo demo (seguridad.exponer-codigos=true). En prod es obligatorio.
spring.mail.host=${ADAPTCODE_MAIL_HOST:}
spring.mail.port=${ADAPTCODE_MAIL_PORT:587}
spring.mail.username=${ADAPTCODE_MAIL_USERNAME:}
spring.mail.password=${ADAPTCODE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Rate limiting por identidad y por grupo de rutas (peticiones por minuto).
# Las rutas de autenticación se limitan por IP; el resto, por usuario autenticado
# (o por IP si es anónimo), para que una clase detrás de un NAT no comparta cupo.
seguridad.rate-limit-habilitado=true
# Solo activar detras de un proxy propio que sobrescriba X-Forwarded-For.
seguridad.rate-limit-confiar-proxy=false
seguridad.rate-limit-general-por-minuto=240
seguridad.rate-limit-auth-por-minuto=60
seguridad.rate-limit-pin-por-minuto=60
seguridad.rate-limit-juego-por-minuto=300

# Eventos en vivo (SSE) por sala. El ticket es de un solo uso y dura 60 s.
sala.sse-timeout-ms=1800000
sala.sse-max-conexiones-por-sala=500
sala.sse-max-tickets-por-usuario=10
sala.sse-heartbeat-ms=20000

# Margen de red para aceptar una respuesta enviada justo al vencer el plazo.
sala.gracia-tiempo-ms=2000

# El correo se envía fuera de la transacción: un executor acotado evita que
# picos de registros agoten los hilos de la aplicación.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=500

# DEMO SIN SERVICIO DE CORREO: devuelve el código en la respuesta JSON.
# En prod debe ser false y el código se envía por correo.
seguridad.exponer-codigos=false

# No filtrar detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Documentacion OpenAPI / Swagger UI. Se puede desactivar por entorno con
# SPRINGDOC_ENABLED=false (por ejemplo, en una exposicion publica de produccion).
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

# Observabilidad: solo health e info expuestos; metricas protegidas.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Logs con traceId (ver TraceIdFilter). El patrón incluye el id de correlación
# para poder seguir una petición completa en los logs.
logging.pattern.level=%5p [%X{traceId:-}]
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] %-40.40logger{39} : %m%n
