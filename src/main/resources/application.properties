spring.application.name=adaptcode-utp-api

# Render asigna el puerto en la variable PORT; en local se usa 8080.
server.port=${PORT:8080}

spring.datasource.url=${ADAPTCODE_DB_URL:jdbc:postgresql://localhost:5433/adaptcode_utp}
spring.datasource.username=${ADAPTCODE_DB_USERNAME}
spring.datasource.password=${ADAPTCODE_DB_PASSWORD}

# Solo para desarrollo local; los esquemas publicados requieren migraciones controladas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Seguridad JWT (cambiar jwt.secret en entornos publicados; mínimo 32 caracteres).
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.emitter=adaptcode-utp-api

# Códigos de verificación y recuperación (en minutos).
seguridad.codigo-expiracion-minutos=30
