# Perfil de produccion. Activar con ADAPTCODE_PROFILE=prod.
# SecretosValidator impide arrancar si queda cualquier valor de demo.

# El esquema lo controla Flyway; Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Los codigos nunca se devuelven: se envian por correo.
seguridad.exponer-codigos=false

# Observabilidad y errores sin detalles internos.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Cookies/CSRF no aplican (API stateless con Bearer), pero el HSTS si.
server.forward-headers-strategy=framework
