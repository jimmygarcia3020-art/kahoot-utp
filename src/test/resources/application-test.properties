# Perfil de pruebas: H2 en memoria, sin Flyway ni Postgres. La suite debe poder
# correr en cualquier maquina y en CI sin servicios externos.
spring.datasource.url=jdbc:h2:mem:adaptcode_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el esquema desde las entidades; las migraciones se prueban
# contra Postgres en el pipeline de despliegue.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Secretos de prueba (nunca se usan fuera de test).
jwt.secret=test-jwt-secret-con-mas-de-32-caracteres-2026
jwt.expiration=900000
jwt.refresh-expiration=2592000000
jwt.emitter=adaptcode-utp-api
seguridad.codigo-pepper=test-codigo-pepper-con-mas-de-16-caracteres

# Sin SMTP: los tests leen el codigo de la respuesta como el perfil demo.
spring.mail.host=
seguridad.exponer-codigos=true

# Limites holgados para no interferir con las pruebas funcionales.
seguridad.codigo-max-por-dia=1000
seguridad.refresh-max-sesiones=100
sala.sse-max-tickets-por-usuario=100
sala.gracia-tiempo-ms=2000
seguridad.login-max-intentos=50
seguridad.codigo-max-intentos=5
seguridad.codigo-reenvio-segundos=0
seguridad.rate-limit-general-por-minuto=10000
seguridad.rate-limit-auth-por-minuto=10000
seguridad.rate-limit-pin-por-minuto=10000
seguridad.rate-limit-juego-por-minuto=10000

logging.level.root=WARN
logging.level.com.adaptcode.utp=INFO
